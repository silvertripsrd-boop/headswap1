name: Build Headswap APK (Android 14 Ready)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Clonar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17 (Actualizado a v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Inyectar certificados SSL y ajustar SDK para Android 14
        run: |
          mkdir -p android/app/src/main/assets/aa/jvc
          mkdir -p android/app/src/main/assets/aa/hur
          
          # Descargar certificados públicos JVC / HUR
          curl -f -sL https://raw.githubusercontent.com/f1xpl/aasdk/development/cert/headunit.crt -o android/app/src/main/assets/aa/jvc/cert.pem || \
          curl -f -sL https://raw.githubusercontent.com/opencardev/aasdk/development/cert/headunit.crt -o android/app/src/main/assets/aa/jvc/cert.pem
          
          curl -f -sL https://raw.githubusercontent.com/f1xpl/aasdk/development/cert/headunit.key -o android/app/src/main/assets/aa/jvc/key.pem || \
          curl -f -sL https://raw.githubusercontent.com/opencardev/aasdk/development/cert/headunit.key -o android/app/src/main/assets/aa/jvc/key.pem
          
          cp android/app/src/main/assets/aa/jvc/cert.pem android/app/src/main/assets/aa/hur/cert.pem
          cp android/app/src/main/assets/aa/jvc/key.pem android/app/src/main/assets/aa/hur/key.pem
          
          # Forzar compatibilidad con Android 14 (minSdk 29 / targetSdk 34)
          sed -i 's/minSdk\s*=\s*[0-9]\+/minSdk = 29/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion([0-9]\+)/minSdkVersion(29)/g' android/app/build.gradle* || true
          sed -i 's/targetSdk\s*=\s*[0-9]\+/targetSdk = 34/g' android/app/build.gradle* || true
          sed -i 's/targetSdkVersion([0-9]\+)/targetSdkVersion(34)/g' android/app/build.gradle* || true

      - name: 4. Aceptar licencias de Android SDK y compilar APK
        working-directory: ./android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Headswap-Android14-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
