name: Build Headswap APK (Android 14 Ready)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Clonar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Crear certificados SSL locales y ajustar SDK para Android 14
        run: |
          mkdir -p android/app/src/main/assets/aa/jvc
          mkdir -p android/app/src/main/assets/aa/hur

          # Intentar bajar de headunit-revived y, si falla, generar/escribir el PEM directamente
          curl -f -sL https://raw.githubusercontent.com/andreknieriem/headunit-revived/master/app/src/main/res/raw/cert -o android/app/src/main/assets/aa/jvc/cert.pem || \
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout android/app/src/main/assets/aa/jvc/key.pem \
            -out android/app/src/main/assets/aa/jvc/cert.pem \
            -days 3650 -subj "/C=JP/ST=Tokyo/L=Tokyo/O=JVCKENWOOD/OU=Automotive/CN=JVCKENWOOD"

          if [ ! -f android/app/src/main/assets/aa/jvc/key.pem ]; then
            curl -f -sL https://raw.githubusercontent.com/andreknieriem/headunit-revived/master/app/src/main/res/raw/privkey -o android/app/src/main/assets/aa/jvc/key.pem || true
          fi

          cp android/app/src/main/assets/aa/jvc/cert.pem android/app/src/main/assets/aa/hur/cert.pem
          cp android/app/src/main/assets/aa/jvc/key.pem android/app/src/main/assets/aa/hur/key.pem

          # Forzar compatibilidad con Android 14 (minSdk 29 / targetSdk 34)
          sed -i 's/minSdk\s*=\s*[0-9]\+/minSdk = 29/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion([0-9]\+)/minSdkVersion(29)/g' android/app/build.gradle* || true
          sed -i 's/targetSdk\s*=\s*[0-9]\+/targetSdk = 34/g' android/app/build.gradle* || true
          sed -i 's/targetSdkVersion([0-9]\+)/targetSdkVersion(34)/g' android/app/build.gradle* || true

      - name: 4. Aceptar licencias de Android SDK y compilar APK
        working-directory: ./android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 5. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Headswap-Android14-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
